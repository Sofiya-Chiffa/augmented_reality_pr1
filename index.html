<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>практика 1 — задание 2</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
        style="position: fixed; inset: 0;">

        <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; color: #ffe9c4; intensity: 1.1"
                  position="2 3 2"></a-entity>
        <a-entity light="type: directional; color: #9fd3ff; intensity: 0.4"
                  position="-2 1 -2"></a-entity>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model
                src="./free_stylized_low_poly_snail.glb"
                position="0 0 0"
                scale="0.4 0.4 0.4"
                rotation="0 0 0"></a-gltf-model>
        </a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

</body>
</html>
