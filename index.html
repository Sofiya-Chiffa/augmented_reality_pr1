<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>практика 1 — задание 2</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
        #startBtn {
            position: fixed; inset: 0; margin: auto;
            width: 240px; height: 60px;
            border: none; border-radius: 30px;
            background: #fff; color: #111;
            font: 600 18px system-ui, sans-serif;
            cursor: pointer; z-index: 10;
        }
    </style>
</head>
<body>

    <button id="startBtn">Начать AR</button>

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
        style="position: fixed; inset: 0;">

        <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; color: #ffe9c4; intensity: 1.1"
                  position="2 3 2"></a-entity>
        <a-entity light="type: directional; color: #9fd3ff; intensity: 0.4"
                  position="-2 1 -2"></a-entity>

        <!-- targetIndex: 0 — первый маркер из targets.mind -->
        <a-entity mindar-image-target="targetIndex: 0">

            <a-gltf-model
                src="./free_stylized_low_poly_snail.glb"
                position="0 0 0"
                scale="0.4 0.4 0.4"
                rotation="0 0 0"></a-gltf-model>

        </a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startBtn').style.display = 'none';
            scene.systems['mindar-image-system'].start();
        });
    </script>
</body>
</html>
